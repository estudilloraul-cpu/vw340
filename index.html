<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bitácora">
  <title>VW340 · Portugal 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fatal" hidden><h1>No se ha podido iniciar la app</h1><p>Recarga la página. Si continúa, borra los datos del sitio y vuelve a abrirla.</p></div>
  <div id="app">
    <header class="topbar">
      <button class="icon-button" id="menuBtn" data-go="more" aria-label="Más opciones">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <button class="wordmark brand-home" data-go="cover" aria-label="Volver a la portada"><img src="images/logo-vw340-charcoal.png" alt="VW340"></button>
      <button class="icon-button" id="searchBtn" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="m16 16 4 4"/></svg>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="bottom" aria-label="Navegación principal">
      <button data-go="cover" class="nav-brand-home"><span class="navicon"><img src="images/logo-vw340-terracotta.png" alt=""></span><em>Inicio</em></button>
      <button data-go="route"><span class="navicon"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></span><em>Ruta</em></button>
      <button data-go="girls"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8.5 14c1.1 1.35 2.25 2 3.5 2s2.4-.65 3.5-2"/></svg></span><em>Misiones</em></button>
      <button data-go="journal"><span class="navicon"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11H8.5A3.5 3.5 0 0 1 5 15.5z"/><path d="M8 4.5v11A3.5 3.5 0 0 0 11.5 19"/></svg></span><em>Bitácora</em></button>
      <button data-go="more"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span><em>Más</em></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden><div class="sheet"><button class="close" data-close aria-label="Cerrar">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
