<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bitácora">
  <title>VW340 · Portugal 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fatal" hidden><h1>No se ha podido iniciar la app</h1><p>Recarga la página. Si continúa, borra los datos del sitio y vuelve a abrirla.</p></div>
  <div id="app">
    <header class="topbar">
      <button class="icon-button" id="menuBtn" data-go="more" aria-label="Más opciones"><span class="menu-lines"></span></button>
      <button class="wordmark" data-go="home" aria-label="Inicio"><strong>BITÁCORA</strong><small>PORTUGAL 2026</small></button>
      <button class="icon-button bell" id="searchBtn" aria-label="Buscar"><span>⌕</span></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="bottom" aria-label="Navegación principal">
      <button data-go="home"><span class="navicon">⌂</span><em>Hoy</em></button>
      <button data-go="route"><span class="navicon">⌖</span><em>Ruta</em></button>
      <button data-go="girls"><span class="navicon">☺</span><em>Greta & Maria</em></button>
      <button data-go="journal"><span class="navicon">▱</span><em>Bitácora</em></button>
      <button data-go="more"><span class="navicon">•••</span><em>Más</em></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden><div class="sheet"><button class="close" data-close aria-label="Cerrar">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
